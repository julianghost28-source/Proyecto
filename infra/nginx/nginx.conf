events {}

http {
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=15r/s;

    upstream airport_service {
        server airport-service:8010;
        keepalive 16;
    }

    upstream itinerary_service {
        server itinerary-service:8000;
        keepalive 16;
    }

    upstream notification_service {
        server notification-service:8000;
        keepalive 16;
    }

    server {
        listen 8000;
        server_name localhost;

        location /api/airports {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://airport_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/itineraries {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://itinerary_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/notifications {
            limit_req zone=api_limit burst=30 nodelay;
            proxy_pass http://notification_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /health {
            proxy_pass http://airport_service;
        }

        location / {
            proxy_pass http://airport_service;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
