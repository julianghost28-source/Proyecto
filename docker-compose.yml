name: personal-itinerary-system

# Fase 1 — infraestructura compartida.
# Los microservicios se añaden en fases posteriores; cada uno usará su propia
# persistencia y esta red. Las bases PostgreSQL no se publican en el host.

services:
  postgres-airport:
    image: postgres:16-alpine
    container_name: pis-postgres-airport
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AIRPORT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRPORT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRPORT_POSTGRES_DB}
    volumes:
      - airport_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - itinerary-net

  postgres-itinerary:
    image: postgres:16-alpine
    container_name: pis-postgres-itinerary
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ITINERARY_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ITINERARY_POSTGRES_PASSWORD}
      POSTGRES_DB: ${ITINERARY_POSTGRES_DB}
    volumes:
      - itinerary_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - itinerary-net

  postgres-notification:
    image: postgres:16-alpine
    container_name: pis-postgres-notification
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${NOTIFICATION_POSTGRES_USER}
      POSTGRES_PASSWORD: ${NOTIFICATION_POSTGRES_PASSWORD}
      POSTGRES_DB: ${NOTIFICATION_POSTGRES_DB}
    volumes:
      - notification_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - itinerary-net

  redis:
    image: redis:7-alpine
    container_name: pis-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    networks:
      - itinerary-net

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: pis-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./infra/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./infra/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - itinerary-net

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: pis-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://127.0.0.1:16686/ || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - itinerary-net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.109.0
    container_name: pis-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infra/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      jaeger:
        condition: service_healthy
    # Distroless image: no wget/curl. Liveness is the OTLP/health extension
    # bound on 13133; Prometheus scrapes 8888/8889 once the process is up.
    networks:
      - itinerary-net

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: pis-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      otel-collector:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "-q",
          "http://127.0.0.1:9090/-/healthy",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - itinerary-net

  grafana:
    image: grafana/grafana:11.2.0
    container_name: pis-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      jaeger:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --spider -q http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - itinerary-net

networks:
  itinerary-net:
    name: personal-itinerary-net
    driver: bridge

volumes:
  airport_pg_data:
  itinerary_pg_data:
  notification_pg_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

