[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pis-platform"
version = "0.1.0"
description = "Shared platform kit for the Personal Itinerary System"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "PyJWT>=2.9.0",
  "prometheus-client>=0.21.0",
  "sqlalchemy[asyncio]>=2.0.35",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "aio-pika>=9.4.0",
  "aiosqlite>=0.20.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "uvicorn>=0.32.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["pis_platform*"]
